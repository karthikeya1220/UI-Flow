<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Flow — System Architecture</title>
  <style>
    :root {
      --bg: #f8fafc;
      --bg2: #ffffff;
      --fg: #1e293b;
      --fg2: #2b2e31;
      --border: #e2e8f0;
      --accent: #6366f1;
      --accent2: #06b6d4;
      --layer1: #ede9fe;
      --layer2: #dbeafe;
      --layer3: #d1fae5;
      --layer4: #fef3c7;
      --node-bg: #ffffff;
      --node-border: #cbd5e1;
      --node-shadow: rgba(0, 0, 0, .08);
      --edge: #94a3b8;
      --edge-active: #6366f1;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg2: #1e293b;
      --fg: #f1f5f9;
      --fg2: #94a3b8;
      --border: #334155;
      --accent: #818cf8;
      --accent2: #22d3ee;
      --layer1: #1e1b4b;
      --layer2: #172554;
      --layer3: #064e3b;
      --layer4: #451a03;
      --node-bg: #1e293b;
      --node-border: #475569;
      --node-shadow: rgba(0, 0, 0, .3);
      --edge: #64748b;
      --edge-active: #818cf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      height: 100vh;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-sub {
      font-size: 12px;
      color: var(--fg2);
      margin-left: 12px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .controls button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all .2s;
    }

    .controls button:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .controls button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Canvas */
    .canvas {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      cursor: grab;
    }

    .canvas:active {
      cursor: grabbing;
    }

    .canvas svg {
      width: 100%;
      height: 100%;
    }

    /* Layer bands */
    .layer-band {
      rx: 12;
      ry: 12;
      opacity: 0.35;
    }

    .layer-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      fill: var(--fg2);
      opacity: 0.6;
    }

    /* Nodes */
    .node {
      cursor: pointer;
      transition: transform .2s, filter .2s;
    }

    .node:hover {
      transform: scale(1.04);
      filter: brightness(1.05);
    }

    .node rect {
      rx: 10;
      ry: 10;
      stroke-width: 1.5;
      transition: stroke .2s, stroke-width .2s;
    }

    .node:hover rect {
      stroke: var(--accent);
      stroke-width: 2.5;
    }

    .node text {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .node-icon {
      font-size: 20px;
    }

    .node-label {
      font-size: 13px;
      font-weight: 600;
      fill: var(--fg);
    }

    .node-desc {
      font-size: 10px;
      fill: var(--fg2);
    }

    /* Edges */
    .edge {
      fill: none;
      stroke-width: 1.5;
      marker-end: url(#arrowhead);
      opacity: 0.5;
      transition: opacity .3s, stroke .3s, stroke-width .3s;
    }

    .edge.highlight {
      opacity: 1;
      stroke: var(--edge-active);
      stroke-width: 2.5;
    }

    .edge-label {
      font-size: 9px;
      fill: var(--fg2);
      font-weight: 500;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      z-index: 200;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 8px 32px var(--node-shadow);
      max-width: 300px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }

    .tooltip.show {
      opacity: 1;
    }

    .tooltip h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--fg);
    }

    .tooltip p {
      font-size: 12px;
      color: var(--fg2);
      line-height: 1.5;
    }

    .tooltip .tag {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Legend */
    .legend {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 11px;
      color: var(--fg2);
      z-index: 50;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    /* Minimap */
    .minimap {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 180px;
      height: 120px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      z-index: 50;
      opacity: 0.8;
    }

    .minimap:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <script>
    // Theme
    let dark = false;
    function toggleTheme() {
      dark = !dark;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
      document.getElementById('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
    }

    // Pan & Zoom
    const canvas = document.getElementById('canvas');
    const svg = document.getElementById('svg');
    let viewBox = { x: 0, y: 0, w: 1400, h: 900 };
    let isPanning = false, panStart = { x: 0, y: 0 };

    canvas.addEventListener('mousedown', e => {
      if (e.target.closest('.node')) return;
      isPanning = true;
      panStart = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('mousemove', e => {
      if (!isPanning) return;
      const dx = (e.clientX - panStart.x) * viewBox.w / svg.clientWidth;
      const dy = (e.clientY - panStart.y) * viewBox.h / svg.clientHeight;
      viewBox.x -= dx; viewBox.y -= dy;
      panStart = { x: e.clientX, y: e.clientY };
      updateViewBox();
    });
    canvas.addEventListener('mouseup', () => isPanning = false);
    canvas.addEventListener('mouseleave', () => isPanning = false);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const scale = e.deltaY > 0 ? 1.1 : 0.9;
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      const my = (e.clientY - rect.top) / rect.height;
      const nw = viewBox.w * scale, nh = viewBox.h * scale;
      viewBox.x += (viewBox.w - nw) * mx;
      viewBox.y += (viewBox.h - nh) * my;
      viewBox.w = nw; viewBox.h = nh;
      updateViewBox();
    }, { passive: false });

    function updateViewBox() {
      svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
    }
    function resetView() {
      viewBox = { x: 0, y: 0, w: 1400, h: 900 };
      updateViewBox();
    }

    // Tooltips
    const tooltip = document.getElementById('tooltip');
    const tipTitle = document.getElementById('tip-title');
    const tipDesc = document.getElementById('tip-desc');
    const tipTag = document.getElementById('tip-tag');

    const tagMap = {
      browser: 'Client', pages: 'Client', components: 'Client', context: 'Client',
      'api-user': 'API', 'api-wireframe': 'API', 'api-ai': 'API', 'api-export': 'API',
      openrouter: 'External', supabase: 'External', 'firebase-auth': 'External',
      'neon-db': 'Database', credits: 'Database'
    };

    document.querySelectorAll('.node').forEach(node => {
      node.addEventListener('mouseenter', e => {
        const id = node.dataset.id;
        const tip = node.dataset.tip;
        tipTitle.textContent = node.querySelector('.node-label')?.textContent || id;
        tipDesc.textContent = tip || '';
        tipTag.textContent = tagMap[id] || '';
        tooltip.classList.add('show');
      });
      node.addEventListener('mousemove', e => {
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = (e.clientY - 10) + 'px';
      });
      node.addEventListener('mouseleave', () => {
        tooltip.classList.remove('show');
      });
    });

    // Edge highlighting on node hover
    document.querySelectorAll('.node').forEach(node => {
      node.addEventListener('mouseenter', () => {
        const id = node.dataset.id;
        document.querySelectorAll('.edge').forEach(edge => {
          if (edge.dataset.from === id || edge.dataset.to === id) {
            edge.classList.add('highlight');
            edge.style.markerEnd = 'url(#arrowhead-active)';
          }
        });
      });
      node.addEventListener('mouseleave', () => {
        document.querySelectorAll('.edge').forEach(edge => {
          edge.classList.remove('highlight');
          edge.style.markerEnd = 'url(#arrowhead)';
        });
      });
    });
  </script>
</body>

</html>
